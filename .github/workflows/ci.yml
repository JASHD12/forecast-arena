name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # T284: the suite takes 11-13 min on the runner plus 2 min install; 15 min was too tight
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          make setup
          .venv/bin/pip install -r requirements/tracking.txt -r requirements/ml.txt
          .venv/bin/pip install -r requirements/torch.txt
          .venv/bin/pip install -r requirements/ts.txt -r requirements/rag.txt -r requirements/graph.txt -r requirements/mcp.txt -r requirements/dashboard.txt -r requirements/api.txt -r requirements/lab.txt -r requirements/onnx.txt -r requirements/vectordb.txt
      - name: make check (with test coverage)
        run: |
          set -o pipefail
          # T188: coverage floor; README badges must not overstate what CI measures
          make check PYTEST_ARGS="--cov=arena --cov-report=term --cov-report=xml --junitxml=junit.xml --cov-fail-under=87" | tee check.log
          .venv/bin/python scripts/badges.py --check coverage.xml junit.xml
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Test coverage (package \`arena\`)"
            echo '```'
            grep -E "^(Name|TOTAL)" check.log || echo "no coverage report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ml-inference:
    # The morning environment must load every promotable artifact without training extras.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the morning inference runtimes
        run: |
          make setup
          .venv/bin/pip install -r requirements/inference.txt
          .venv/bin/python -c "import lightgbm, torch"
      - name: Publish models then forecast in fresh processes
        run: .venv/bin/python -m pytest tests/e2e/test_ml_inference.py

  a11y:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: make setup
      - name: Install axe-core and Chromium
        working-directory: tools/a11y
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: TypeScript: type-check site_ts and verify the compiled app.js is current (T296)
        run: |
          npm ci --prefix tools/site-ts
          make site-ts
          git diff --exit-code src/arena/site/static/app.js
      - name: Accessibility lint (fails on serious or critical issues)
        run: make a11y
      - name: Run the analysis notebook on the e2e export (T138)
        run: |
          .venv/bin/pip install -r requirements/nb.txt
          make notebook

  docker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the reproducibility image (not pushed anywhere)
        run: docker build -t forecast-arena:ci .
      - name: Run the offline end-to-end test in the container
        run: docker run --rm --network none forecast-arena:ci
      - name: Serve the REST API from the image and smoke-test it (T150)
        run: |
          docker run -d --name arena-api -p 8000:8000 forecast-arena:ci sh -c \
            ".venv/bin/python scripts/make_e2e_ledger.py /tmp/ledger && .venv/bin/arena --ledger-dir /tmp/ledger api --host 0.0.0.0 --port 8000"
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS "http://127.0.0.1:8000/questions?limit=2" | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d)==2, d"
          curl -fsS "http://127.0.0.1:8000/leaderboard" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['rows'], d"
          curl -fsS http://127.0.0.1:8000/metrics | grep -q '^arena_http_requests_total'  # T295
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8000/sql?q=DROP%20TABLE%20skips')" = 400
          # T277: the route exists and answers 503 (no model mounted) with onnxruntime importable in the image
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"stat":"mean","target_date":"2026-11-02","daily":[],"threshold":50}' http://127.0.0.1:8000/predict/power)" = 503
          docker exec arena-api .venv/bin/python -c "import onnxruntime"
          docker logs arena-api | tail -5

  dbt:
    # T152: dbt build (models + tests) over the open-data export of the offline e2e run.
    # dbt lives in its own virtual environment (its python-dateutil<3 pin conflicts with
    # the main pins); duckdb is pinned to the same version as the main lock file.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies and the e2e export
        run: |
          make setup
          make site-e2e
      - name: dbt build (models and tests)
        run: |
          python -m venv .venv-dbt
          .venv-dbt/bin/pip install -r requirements/dbt.txt
          cd analytics/dbt
          DBT_SEND_ANONYMOUS_USAGE_STATS=false ARENA_DATA_DIR="$GITHUB_WORKSPACE/_site_e2e/data" \
            ../../.venv-dbt/bin/dbt build --profiles-dir .

  airflow:
    # T153: parse the DAGs with Airflow's DagBag and check their shape. Airflow lives in
    # its own virtual environment with Airflow's official constraints; nothing is deployed.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Airflow (official constraints) and check the DAGs
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
        run: |
          python -m venv .venv-airflow
          .venv-airflow/bin/pip install -r orchestration/airflow/requirements.txt \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.4.0/constraints-3.12.txt
          .venv-airflow/bin/python orchestration/airflow/check_dags.py

  kubernetes:
    # T151: apply deploy/k8s/ to a throwaway kind cluster and smoke-test it. Nothing is
    # hosted; this only proves the manifests and the image work on Kubernetes.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t forecast-arena:ci .
      - uses: helm/kind-action@v1
        with:
          cluster_name: arena
      - name: Load the image into kind and apply the manifests
        run: |
          kind load docker-image forecast-arena:ci --name arena
          kubectl apply -f deploy/k8s/
          kubectl rollout status deployment/arena-api --timeout=300s
      - name: Smoke-test the API through the Service
        run: |
          kubectl port-forward service/forecast-arena-api 8000:80 >/tmp/pf.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS "http://127.0.0.1:8000/leaderboard" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['rows'], d"
          curl -fsS http://127.0.0.1:8000/metrics | grep -q '^arena_http_requests_total'  # T295
      - name: Run the CronJob once and check it succeeds
        run: |
          kubectl create job verify-once --from=cronjob/arena-verify
          kubectl wait --for=condition=complete job/verify-once --timeout=300s
          kubectl logs job/verify-once | tail -3
      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get all
          kubectl describe pods | tail -60
          kubectl logs deployment/arena-api --previous --tail=50 || true
          kubectl logs deployment/arena-api --tail=50 || true

  vectordb:
    # T291: the same retrieval tests against a real Qdrant server (local mode runs in `check`).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.2  # Apache-2.0; tag checked on Docker Hub 2026-11-22
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install pinned dependencies
        run: |
          make setup
          .venv/bin/pip install -r requirements/vectordb.txt
      - name: Retrieval tests against the server
        env:
          ARENA_QDRANT_URL: http://localhost:6333
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:6333/healthz && break; sleep 2; done
          .venv/bin/python -m pytest tests/unit/test_vectorstore.py -q

  observability:
    # T295: Prometheus scrapes the API's /metrics and Jaeger receives OTLP traces (both real servers).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install pinned dependencies
        run: |
          make setup
          .venv/bin/pip install -r requirements/api.txt
      - name: Prometheus scrapes /metrics and Jaeger receives OTLP traces
        run: scripts/smoke_observability.sh
      - name: Logs on failure
        if: failure()
        run: |
          docker logs arena-prom 2>&1 | tail -20 || true
          docker logs arena-jaeger 2>&1 | tail -20 || true
          tail -20 api.log || true

  audit:
    # Vulnerability report for the pinned dependencies. Non-blocking: findings appear in
    # the job summary and are fixed through normal commits, never automatically.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit of the lock, tracking, ML, time-series, RAG, LangGraph and MCP requirement files
        run: |
          python -m pip install pip-audit==2.10.1
          {
            echo "## Dependency vulnerability audit"
            echo '```'
            pip-audit -r requirements/lock.txt -r requirements/tracking.txt -r requirements/ml.txt -r requirements/ts.txt -r requirements/rag.txt -r requirements/graph.txt -r requirements/mcp.txt -r requirements/nb.txt -r requirements/dashboard.txt -r requirements/api.txt --progress-spinner off 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
