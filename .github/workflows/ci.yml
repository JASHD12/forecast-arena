name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          make setup
          .venv/bin/pip install -r requirements-tracking.txt -r requirements-ml.txt
          .venv/bin/pip install -r requirements-torch.txt
          .venv/bin/pip install -r requirements-ts.txt -r requirements-rag.txt -r requirements-graph.txt
      - name: make check (with test coverage)
        run: |
          set -o pipefail
          make check PYTEST_ARGS="--cov=arena --cov-report=term" | tee check.log
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Test coverage (package \`arena\`)"
            echo '```'
            grep -E "^(Name|TOTAL)" check.log || echo "no coverage report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  a11y:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: make setup
      - name: Install axe-core and Chromium
        working-directory: tools/a11y
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Accessibility lint (fails on serious or critical issues)
        run: make a11y

  docker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the reproducibility image (not pushed anywhere)
        run: docker build -t forecast-arena:ci .
      - name: Run the offline end-to-end test in the container
        run: docker run --rm --network none forecast-arena:ci

  audit:
    # Vulnerability report for the pinned dependencies. Non-blocking: findings appear in
    # the job summary and are fixed through normal commits, never automatically.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit of the lock, tracking, ML, time-series, RAG and LangGraph requirement files
        run: |
          python -m pip install pip-audit==2.10.1
          {
            echo "## Dependency vulnerability audit"
            echo '```'
            pip-audit -r requirements-lock.txt -r requirements-tracking.txt -r requirements-ml.txt -r requirements-ts.txt -r requirements-rag.txt -r requirements-graph.txt --progress-spinner off 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
