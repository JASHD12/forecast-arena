name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          make setup
          .venv/bin/pip install -r requirements-tracking.txt -r requirements-ml.txt
          .venv/bin/pip install -r requirements-torch.txt
          .venv/bin/pip install -r requirements-ts.txt -r requirements-rag.txt -r requirements-graph.txt -r requirements-mcp.txt -r requirements-dashboard.txt -r requirements-api.txt
      - name: make check (with test coverage)
        run: |
          set -o pipefail
          make check PYTEST_ARGS="--cov=arena --cov-report=term" | tee check.log
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Test coverage (package \`arena\`)"
            echo '```'
            grep -E "^(Name|TOTAL)" check.log || echo "no coverage report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  a11y:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: make setup
      - name: Install axe-core and Chromium
        working-directory: tools/a11y
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Accessibility lint (fails on serious or critical issues)
        run: make a11y
      - name: Run the analysis notebook on the e2e export (T138)
        run: |
          .venv/bin/pip install -r requirements-nb.txt
          make notebook

  docker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the reproducibility image (not pushed anywhere)
        run: docker build -t forecast-arena:ci .
      - name: Run the offline end-to-end test in the container
        run: docker run --rm --network none forecast-arena:ci
      - name: Serve the REST API from the image and smoke-test it (T150)
        run: |
          docker run -d --name arena-api -p 8000:8000 forecast-arena:ci sh -c \
            ".venv/bin/python scripts/make_e2e_ledger.py /tmp/ledger && .venv/bin/arena --ledger-dir /tmp/ledger api --host 0.0.0.0 --port 8000"
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS "http://127.0.0.1:8000/questions?limit=2" | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d)==2, d"
          curl -fsS "http://127.0.0.1:8000/leaderboard" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['rows'], d"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8000/sql?q=DROP%20TABLE%20skips')" = 400
          docker logs arena-api | tail -5

  dbt:
    # T152: dbt build (models + tests) over the open-data export of the offline e2e run.
    # dbt lives in its own virtual environment (its python-dateutil<3 pin conflicts with
    # the main pins); duckdb is pinned to the same version as the main lock file.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies and the e2e export
        run: |
          make setup
          make site-e2e
      - name: dbt build (models and tests)
        run: |
          python -m venv .venv-dbt
          .venv-dbt/bin/pip install -r requirements-dbt.txt
          cd analytics/dbt
          DBT_SEND_ANONYMOUS_USAGE_STATS=false ARENA_DATA_DIR="$GITHUB_WORKSPACE/_site_e2e/data" \
            ../../.venv-dbt/bin/dbt build --profiles-dir .

  kubernetes:
    # T151: apply deploy/k8s/ to a throwaway kind cluster and smoke-test it. Nothing is
    # hosted; this only proves the manifests and the image work on Kubernetes.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t forecast-arena:ci .
      - uses: helm/kind-action@v1
        with:
          cluster_name: arena
      - name: Load the image into kind and apply the manifests
        run: |
          kind load docker-image forecast-arena:ci --name arena
          kubectl apply -f deploy/k8s/
          kubectl rollout status deployment/arena-api --timeout=300s
      - name: Smoke-test the API through the Service
        run: |
          kubectl port-forward service/forecast-arena-api 8000:80 >/tmp/pf.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS "http://127.0.0.1:8000/leaderboard" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['rows'], d"
      - name: Run the CronJob once and check it succeeds
        run: |
          kubectl create job verify-once --from=cronjob/arena-verify
          kubectl wait --for=condition=complete job/verify-once --timeout=300s
          kubectl logs job/verify-once | tail -3
      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get all
          kubectl describe pods | tail -60
          kubectl logs deployment/arena-api --previous --tail=50 || true
          kubectl logs deployment/arena-api --tail=50 || true

  audit:
    # Vulnerability report for the pinned dependencies. Non-blocking: findings appear in
    # the job summary and are fixed through normal commits, never automatically.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit of the lock, tracking, ML, time-series, RAG, LangGraph and MCP requirement files
        run: |
          python -m pip install pip-audit==2.10.1
          {
            echo "## Dependency vulnerability audit"
            echo '```'
            pip-audit -r requirements-lock.txt -r requirements-tracking.txt -r requirements-ml.txt -r requirements-ts.txt -r requirements-rag.txt -r requirements-graph.txt -r requirements-mcp.txt -r requirements-nb.txt -r requirements-dashboard.txt -r requirements-api.txt --progress-spinner off 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
