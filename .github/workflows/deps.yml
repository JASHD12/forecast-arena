name: deps

# Monthly list of outdated pins (report only: no automatic upgrades or merges).
# The report goes to the job summary. Opening an issue with it needs the owner's approval
# (HUMAN_TODO.md H11; task T084b).

on:
  schedule:
    - cron: "17 6 1 * *"  # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outdated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the pinned dependencies
        run: |
          make setup
          .venv/bin/pip install -r requirements-tracking.txt -r requirements-ml.txt
      - name: Outdated pins report
        run: |
          {
            echo "## Outdated pins ($(date -u +%Y-%m-%d))"
            echo '```'
            .venv/bin/pip list --outdated --format=columns --exclude forecast-arena
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
