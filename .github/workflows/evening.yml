name: evening

# T160: publish tomorrow's questions tonight, so people can answer before the 09:30 UTC
# lock. No forecasts here: the machine forecasters answer in the morning job, before the
# same lock. Scheduled runs use the stable branch; a manual dispatch runs the ref it was
# started from. dry_run works on a throwaway copy of the ledger and pushes nothing.

on:
  schedule:
    # T180: hourly from 16:00 to 23:00 UTC; the gate lets only the first run publish.
    - cron: "0 16-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do everything on a throwaway copy of the ledger; push and deploy nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: arena-ledger  # shared with morning, resolve and weekly: one ledger writer at a time
  cancel-in-progress: false

jobs:
  gate:
    # T180: GitHub starts scheduled runs hours late, so the job is scheduled often and this
    # small job decides from the clock and the ledger whether a run has anything to do.
    # Manual dispatches are always due.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      due: ${{ steps.manual.outputs.due || steps.sched.outputs.due }}
    steps:
      - name: Manual runs are always due
        id: manual
        if: github.event_name != 'schedule'
        run: echo "due=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: github.event_name == 'schedule'
        with:
          ref: stable
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: github.event_name == 'schedule'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install pinned dependencies
        if: github.event_name == 'schedule'
        run: make setup
      - name: Is the evening job due?
        id: sched
        if: github.event_name == 'schedule'
        env:
          ARENA_LEDGER_REMOTE: https://github.com/${{ github.repository }}.git
        run: .venv/bin/arena schedule due --job evening --sync

  run:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # push to the ledger branch (built-in token)
      issues: write  # open/update/close the `incident` issue (standing approval 5)
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
    env:
      ARENA_CONTACT: ${{ vars.ARENA_CONTACT }}
      ARENA_DASHBOARD_URL: ${{ vars.ARENA_DASHBOARD_URL }}
      ARENA_LEDGER_REMOTE: https://github.com/${{ github.repository }}.git
      ARENA_DOMAINS: ${{ vars.ARENA_DOMAINS || 'power' }}
      ARENA_OFFICIAL_START_NOT_BEFORE: ${{ vars.ARENA_OFFICIAL_START_NOT_BEFORE || '2099-12-31' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'stable' }}
          persist-credentials: false  # the ledger push sets its own header; avoid a duplicate
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install pinned dependencies
        run: make setup
      - name: Restore cached source data
        uses: actions/cache@v6
        with:
          path: data_cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-
      - name: Mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Let git push the ledger branch with the built-in token
        env:
          TOKEN: ${{ github.token }}
        run: |
          header=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $header"
          git config --global user.name forecast-arena-bot
          git config --global user.email forecast-arena-bot@users.noreply.github.com
      - name: evening job
        run: |
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then
            .venv/bin/arena --dry-run daily evening --push
          else
            .venv/bin/arena daily evening --push
          fi
      - name: Verify the ledger
        if: steps.mode.outputs.dry_run == 'false'
        run: .venv/bin/arena ledger verify --git
      - name: Build the site from the ledger
        run: .venv/bin/arena site build --out site
      - name: Upload the site for Pages
        if: steps.mode.outputs.dry_run == 'false'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Health check (SPEC 12)
        id: health
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail  # keep the check's exit code through tee
          .venv/bin/arena health check --job evening --report health.json ${{ steps.mode.outputs.dry_run == 'false' && '--record' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open, update or close the incident issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/arena health incident --report health.json --job-status "${{ job.status }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Fail the run when a health check failed
        if: always() && steps.health.outcome == 'failure'
        run: exit 1

  deploy:
    needs: run
    if: always() && needs.run.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
