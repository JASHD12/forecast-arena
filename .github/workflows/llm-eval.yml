name: llm-eval

# Manual LLM evaluation on the frozen golden set (T124). Real model calls, under the
# eval's own hard caps (default 60,000 tokens, two requests per question and variant).
# Writes no ledger and deploys nothing: the result is a workflow artifact, which the
# agent commits to evals/results/ on main (labelled "evaluation", never live, I4).

on:
  workflow_dispatch:
    inputs:
      golden:
        description: "T355: frozen golden set (the November set is the pre-registered primary set of lab/prereg/agent-skills.md)"
        type: choice
        options:
          - power-2026-10.jsonl
          - power-2026-11a.jsonl
          - replay-weather-attention-2026-11-25.jsonl
        default: power-2026-10.jsonl
      variants:
        description: "T355: comma-separated variants that replace the default list (llm_plain, llm_context, agent, agent_quant, agent_analyst, agent_skills, agent_committee); empty keeps the boolean inputs below"
        default: ""
      limit:
        description: "Golden questions to sample (stratified, seeded); ignored when per_topic is set"
        default: "24"
      per_topic:
        description: "T406 (Tier C): questions per topic of the replay set (seeded, spread over batch days, only questions with a live ml forecast); empty uses limit"
        default: ""
      max_tokens:
        description: "Hard token cap for this run"
        default: "60000"
      local:
        description: "Also evaluate llm_local (builds llama.cpp; slower)"
        type: boolean
        default: false
      agent:
        description: "T223b: also evaluate the tool-using agent (series and base-rate tools only; about 6 requests per question, so raise max_tokens)"
        type: boolean
        default: false
      quant:
        description: "T344: also evaluate agent_quant and agent_analyst (replayed ml probabilities from evals/golden/ml-probs-power.json; about 6 requests per question each, so raise max_tokens)"
        type: boolean
        default: false
      skills:
        description: "T355: also evaluate agent_skills (agent_quant plus load_skill); run together with quant on the same seeded items"
        type: boolean
        default: false
      self_consistency:
        description: "T298: also evaluate llm_context sampled five times and averaged (5x the tokens of llm_context; owner OK H36 first; raise max_tokens)"
        type: boolean
        default: false
      cache:
        description: "T190: automatic prompt caching (off by default: measured, it raised the cost of one-shot calls)"
        type: boolean
        default: false
      structured:
        description: "T190: schema-constrained answers (structured outputs) for the Claude forecasters"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # T355: the agent variants make several requests per question, one after the other
    env:
      ARENA_CONTACT: ${{ vars.ARENA_CONTACT }}
      ARENA_LLM_PROVIDER: ${{ vars.ARENA_LLM_PROVIDER }}
      ARENA_LLM_MODEL: ${{ vars.ARENA_LLM_MODEL }}
      ARENA_LLM_EFFORT: ${{ vars.ARENA_LLM_EFFORT || 'low' }}  # thinking must not eat the 400-token answer budget
      ARENA_LLM_MAX_OUTPUT_TOKENS: ${{ vars.ARENA_LLM_MAX_OUTPUT_TOKENS || '1024' }}  # T124 eval: 400 cut off thinking answers
      ARENA_LLM_BASE_URL: ${{ vars.ARENA_LLM_BASE_URL }}
      ARENA_LLM_API_KEY: ${{ secrets.ARENA_LLM_API_KEY }}
      ARENA_LLM_CACHE: ${{ inputs.cache && '1' || '0' }}  # T190: changes cost, never the answer
      ARENA_LLM_STRUCTURED: ${{ inputs.structured && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install pinned dependencies
        run: make setup
      - name: Install the A2A SDK (agent_committee only)
        if: contains(inputs.variants, 'agent_committee')
        run: .venv/bin/pip install -r requirements/a2a.txt
      - name: Install the local LLM runtime
        if: inputs.local
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF"
        run: .venv/bin/pip install -r requirements/local.txt
      - name: Restore cached model weights
        if: inputs.local
        uses: actions/cache@v6
        with:
          path: models_cache
          key: models-qwen2.5-1.5b-instruct-q4km-91cad51
      - name: Run the evaluation
        env:
          LIMIT: ${{ inputs.limit }}
          PER_TOPIC: ${{ inputs.per_topic }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          LOCAL: ${{ inputs.local }}
          AGENT: ${{ inputs.agent }}
          SC: ${{ inputs.self_consistency }}
          QUANT: ${{ inputs.quant }}
          SKILLS: ${{ inputs.skills }}
          GOLDEN: ${{ inputs.golden }}
          VARIANTS: ${{ inputs.variants }}
        run: |
          set -o pipefail
          # the replayed ml probabilities belong to one golden set (T386): pick the matching file
          case "$GOLDEN" in
            power-2026-11a.jsonl) MLPROBS=evals/golden/ml-probs-power-11a.json ;;
            replay-weather-attention-2026-11-25.jsonl) MLPROBS=evals/golden/replay-weather-attention-2026-11-25.ml-probs.json ;;
            *) MLPROBS=evals/golden/ml-probs-power.json ;;
          esac
          if [ -n "$VARIANTS" ]; then
            # T355: an explicit list replaces the defaults; only known names are accepted
            if ! printf '%s' "$VARIANTS" | grep -Eq '^(llm_plain|llm_context|agent|agent_quant|agent_analyst|agent_skills|agent_committee)(,(llm_plain|llm_context|agent|agent_quant|agent_analyst|agent_skills|agent_committee))*$'; then
              echo "refused: unknown variant in '$VARIANTS'" >&2; exit 2
            fi
            variants=""
            for v in $(printf '%s' "$VARIANTS" | tr ',' ' '); do variants="$variants --variant $v"; done
            case ",$VARIANTS," in
              *,agent_analyst,*) variants="$variants --ml-probs $MLPROBS" ;;
            esac
          else
            variants="--variant llm_plain --variant llm_context"
            if [ "$LOCAL" = "true" ]; then variants="$variants --variant llm_local"; fi
            if [ "$AGENT" = "true" ]; then variants="$variants --variant agent"; fi
            if [ "$QUANT" = "true" ]; then variants="$variants --variant agent_quant --variant agent_analyst --ml-probs $MLPROBS"; fi
            if [ "$SKILLS" = "true" ]; then variants="$variants --variant agent_skills"; fi
            if [ "$SC" = "true" ]; then variants="$variants --variant llm_context_sc5"; fi
          fi
          if [ -n "$PER_TOPIC" ]; then
            # Tier C: the subset is drawn from the questions that have a live ml forecast
            sizing="--per-topic $PER_TOPIC"
            case "$variants" in *--ml-probs*) ;; *) variants="$variants --ml-probs $MLPROBS" ;; esac
          else
            sizing="--limit $LIMIT"
          fi
          .venv/bin/arena eval run --golden "evals/golden/$GOLDEN" \
            $sizing --max-tokens "$MAX_TOKENS" $variants | tee eval.log
          { echo "## LLM evaluation (not the live record)"; echo '```'; cat eval.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Print the result (the log is how the agent reads it back)
        run: |
          echo "::group::result json"
          cat evals/results/*.json
          echo "::endgroup::"
      - uses: actions/upload-artifact@v7
        with:
          name: llm-eval-result
          path: evals/results/*.json
          retention-days: 30
