name: llm-smoke

# Manual check of the configured LLM provider (T064): two calls, prints token usage,
# writes nothing (no ledger, no push, no deploy).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARENA_LLM_PROVIDER: ${{ vars.ARENA_LLM_PROVIDER }}
      ARENA_LLM_MODEL: ${{ vars.ARENA_LLM_MODEL }}
      ARENA_LLM_EFFORT: ${{ vars.ARENA_LLM_EFFORT }}
      ARENA_LLM_MAX_OUTPUT_TOKENS: ${{ vars.ARENA_LLM_MAX_OUTPUT_TOKENS || '400' }}
      ARENA_LLM_MAX_TOKENS_PER_DAY: ${{ vars.ARENA_LLM_MAX_TOKENS_PER_DAY || '400000' }}
      ARENA_LLM_BASE_URL: ${{ vars.ARENA_LLM_BASE_URL }}
      ARENA_LLM_API_KEY: ${{ secrets.ARENA_LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: make setup
      - name: Two live calls
        run: |
          set -o pipefail
          .venv/bin/arena llm smoke | tee smoke.txt
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat smoke.txt 2>/dev/null || echo "no output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
