name: morning

# Generate today's questions, run every forecaster, seal the batch before the 09:30 UTC lock.
# Scheduled runs use the stable branch (last commit of main that passed CI); a manual
# dispatch runs the ref it was started from. dry_run works on a throwaway copy of the
# ledger, pushes nothing and deploys nothing.

on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC
    - cron: "0 7 * * *"    # 07:00 UTC (second chance: schedules can start late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do everything on a throwaway copy of the ledger; push and deploy nothing"
        type: boolean
        default: true
      fail_health:
        description: "Test only: add a failing health check (opens the incident issue)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arena-ledger  # shared by morning, resolve and weekly: one ledger writer at a time
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # push to the ledger branch (built-in token)
      issues: write  # open/update/close the `incident` issue (standing approval 5)
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
    env:
      ARENA_CONTACT: ${{ vars.ARENA_CONTACT }}
      ARENA_LEDGER_REMOTE: https://github.com/${{ github.repository }}.git
      ARENA_DOMAINS: ${{ vars.ARENA_DOMAINS || 'power' }}
      # T110: never start the official record before this date; replaced by a real date
      # once the roadmap's model and timing changes are live.
      ARENA_OFFICIAL_START_NOT_BEFORE: ${{ vars.ARENA_OFFICIAL_START_NOT_BEFORE || '2099-12-31' }}
      ARENA_LLM_PROVIDER: ${{ vars.ARENA_LLM_PROVIDER }}
      ARENA_LLM_MODEL: ${{ vars.ARENA_LLM_MODEL }}
      ARENA_LLM_EFFORT: ${{ vars.ARENA_LLM_EFFORT || 'low' }}  # thinking must not eat the 400-token answer budget
      ARENA_LLM_MAX_OUTPUT_TOKENS: ${{ vars.ARENA_LLM_MAX_OUTPUT_TOKENS || '400' }}
      ARENA_LLM_MAX_TOKENS_PER_DAY: ${{ vars.ARENA_LLM_MAX_TOKENS_PER_DAY || '150000' }}  # owner: keep cost under ~$1/month on Haiku 5.5
      ARENA_LLM_BASE_URL: ${{ vars.ARENA_LLM_BASE_URL }}
      ARENA_LLM_API_KEY: ${{ secrets.ARENA_LLM_API_KEY }}
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'stable' }}
          persist-credentials: false  # the ledger push sets its own header; avoid a duplicate
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: make setup
      - name: Restore cached source data
        uses: actions/cache@v6
        with:
          path: data_cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-
      - name: Mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Let git push the ledger branch with the built-in token
        env:
          TOKEN: ${{ github.token }}
        run: |
          header=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $header"
          git config --global user.name forecast-arena-bot
          git config --global user.email forecast-arena-bot@users.noreply.github.com
      - name: morning job
        run: |
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then
            .venv/bin/arena --dry-run daily morning --push
          else
            .venv/bin/arena daily morning --push
          fi
      - name: Verify the ledger
        if: steps.mode.outputs.dry_run == 'false'
        run: .venv/bin/arena ledger verify --git
      - name: Build the site from the ledger
        run: .venv/bin/arena site build --out site
      - name: Upload the site for Pages
        if: steps.mode.outputs.dry_run == 'false'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Health check (SPEC 12)
        id: health
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail  # keep the check's exit code through tee
          .venv/bin/arena health check --job morning --report health.json ${{ (github.event_name == 'workflow_dispatch' && inputs.fail_health) && '--force-fail' || '' }} ${{ steps.mode.outputs.dry_run == 'false' && '--record' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open, update or close the incident issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/arena health incident --report health.json --job-status "${{ job.status }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Official start (SPEC 2.9; records the health report, writes the start once)
        if: always() && steps.mode.outputs.dry_run == 'false'
        run: .venv/bin/arena official update --push
      - name: Fail the run when a health check failed
        if: always() && steps.health.outcome == 'failure'
        run: exit 1

  deploy:
    needs: run
    if: always() && needs.run.outputs.dry_run == 'false'  # deploy even when a health check failed
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
