name: morning
run-name: "morning / ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'dry-run' || 'live' }}"

# Generate today's questions, run every forecaster, seal the batch before the 09:30 UTC lock.
# Scheduled runs use the stable branch (last commit of main that passed CI); a manual
# dispatch runs the ref it was started from. dry_run works on a throwaway copy of the
# ledger, pushes nothing and deploys nothing.

on:
  schedule:
    # T180 / T329: three slots an hour from 19:07 UTC the evening before to 08:47 UTC. GitHub fires
    # only a few of them, hours late (about 07:00 UTC on most days, 09:52 on 2026-11-24, after
    # the lock), so the more slots there are, the likelier one lands before the 09:30 UTC lock.
    # The gate decides at the time a run actually starts: a slot that fires early the evening
    # before finds yesterday's batch sealed and stops; one that fires late enough does the work.
    - cron: "7,27,47 19-23,0-8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do everything on a throwaway copy of the ledger; push and deploy nothing"
        type: boolean
        default: true
      fail_health:
        description: "Test only: add a failing health check (opens the incident issue)"
        type: boolean
        default: false
      experimental:
        description: "Dry runs only (T279): switch the experimental agent_hybrid, agent_quant, agent_analyst, agent_skills, agent_graph_skills, agent_hybrid_skills and agent_committee forecasters on to measure runner time, installs and the index build (a dry run has no LLM client, so no tokens; T398)"
        type: boolean
        default: false
      only:
        description: "Dry runs only (T398): switch on just this one experimental forecaster (measures install, model download and index build; a dry run has no LLM client, so it cannot measure tokens). Ignored unless dry_run is true"
        type: choice
        options:
          - ""
          - agent_hybrid
          - agent_quant
          - agent_analyst
          - agent_skills
          - agent_graph_skills
          - agent_hybrid_skills
          - agent_committee
        default: ""

permissions:
  contents: read

concurrency:
  group: arena-ledger  # shared by morning, resolve and weekly: one ledger writer at a time
  cancel-in-progress: false

jobs:
  gate:
    # T180: GitHub starts scheduled runs hours late, so the job is scheduled often and this
    # small job decides from the clock and the ledger whether a run has anything to do.
    # Manual dispatches are always due.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      due: ${{ steps.manual.outputs.due || steps.sched.outputs.due }}
    steps:
      - name: Manual runs are always due
        id: manual
        if: github.event_name != 'schedule'
        run: echo "due=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: github.event_name == 'schedule'
        with:
          ref: stable
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: github.event_name == 'schedule'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install pinned dependencies
        if: github.event_name == 'schedule'
        run: make setup
      - name: Is the morning job due?
        id: sched
        if: github.event_name == 'schedule'
        env:
          ARENA_LEDGER_REMOTE: https://github.com/${{ github.repository }}.git
        run: .venv/bin/arena schedule due --job morning --sync

  run:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # push to the ledger branch (built-in token)
      issues: write  # open/update/close the `incident` issue (standing approval 5)
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
    env:
      ARENA_CONTACT: ${{ vars.ARENA_CONTACT }}
      ARENA_DASHBOARD_URL: ${{ vars.ARENA_DASHBOARD_URL }}  # T143: site links the dashboard only when set (H19)
      ARENA_LEDGER_REMOTE: https://github.com/${{ github.repository }}.git
      ARENA_DOMAINS: ${{ vars.ARENA_DOMAINS || 'power,weather,attention,markets,crypto' }}  # T045e: crypto live (owner, 2026-11-22)
      ARENA_COINGECKO_API_KEY: ${{ secrets.ARENA_COINGECKO_API_KEY }}  # sent only to api.coingecko.com (T045e)
      # T110: never start the official record before this date; replaced by a real date
      # once the roadmap's model and timing changes are live.
      ARENA_OFFICIAL_START_NOT_BEFORE: ${{ vars.ARENA_OFFICIAL_START_NOT_BEFORE || '2099-12-31' }}
      ARENA_LLM_PROVIDER: ${{ vars.ARENA_LLM_PROVIDER }}
      ARENA_LLM_MODEL: ${{ vars.ARENA_LLM_MODEL }}
      ARENA_LLM_EFFORT: ${{ vars.ARENA_LLM_EFFORT || 'low' }}  # thinking must not eat the 400-token answer budget
      ARENA_LLM_MAX_OUTPUT_TOKENS: ${{ vars.ARENA_LLM_MAX_OUTPUT_TOKENS || '1024' }}  # T124 eval: 400 cut off thinking answers
      ARENA_LLM_MAX_TOKENS_PER_DAY: ${{ vars.ARENA_LLM_MAX_TOKENS_PER_DAY || '500000' }}  # owner 2026-11-28: 500,000 so that agent_skills fits next to the live agents (was 300,000 since 2026-11-21; SPEC 9.4)
      ARENA_LLM_BASE_URL: ${{ vars.ARENA_LLM_BASE_URL }}
      ARENA_LLM_API_KEY: ${{ secrets.ARENA_LLM_API_KEY }}
      ARENA_LLM_CACHE: ${{ vars.ARENA_LLM_CACHE || '0' }}  # T190: off; measured, it raised the cost of one-shot calls
      ARENA_LLM_STRUCTURED: ${{ vars.ARENA_LLM_STRUCTURED || '0' }}  # T190: off live until the eval compares both contracts
      ARENA_LLM_PLAIN: ${{ vars.ARENA_LLM_PLAIN || '0' }}  # retired 2026-11-27 (owner decision): 'AI, question only' no longer forecasts; set the variable to 1 to bring it back
      ARENA_LLM_LOCAL: ${{ vars.ARENA_LLM_LOCAL || '1' }}  # T122: open model on the runner CPU, no API cost
      ARENA_LLM_LOCAL_FT: ${{ vars.ARENA_LLM_LOCAL_FT || '1' }}  # T271: fine-tuned model, live since H32 (owner decision 2026-11-22); set the repository variable to 0 to switch it off
      ARENA_AGENT_GRAPH: ${{ vars.ARENA_AGENT_GRAPH || '1' }}  # T121: LangGraph agent, 1 question per topic per day
      ARENA_BANDIT: ${{ vars.ARENA_BANDIT || '0' }}  # T293: bandit_hedge (learned blend of the other forecasters); off until the owner decides
      ARENA_LLM_CONTEXT_CAL: ${{ vars.ARENA_LLM_CONTEXT_CAL || '0' }}  # T382: llm_context_cal (llm_context's answers through a fixed logit map, no tokens); off until its pre-registered test (lab/prereg/analyst-and-calibration.md) is run
      ARENA_SENTIMENT: ${{ vars.ARENA_SENTIMENT || '0' }}  # T373: archive GDELT news-tone aggregates of the five coins in the crypto morning context (no forecaster yet, no secret); off until the owner decides
      ARENA_AGENT_HYBRID: ${{ (inputs.dry_run && (inputs.experimental || inputs.only == 'agent_hybrid')) && '1' || vars.ARENA_AGENT_HYBRID || '0' }}  # T274: agent_hybrid (hybrid retrieval + guards); switched on at launch (T279)
      ARENA_AGENT_QUANT: ${{ (inputs.dry_run && (inputs.experimental || inputs.only == 'agent_quant')) && '1' || vars.ARENA_AGENT_QUANT || '0' }}  # T342: agent_quant (calculator and reference estimate); off until its evaluation passes (T345)
      ARENA_AGENT_ANALYST: ${{ (inputs.dry_run && (inputs.experimental || inputs.only == 'agent_analyst')) && '1' || vars.ARENA_AGENT_ANALYST || '0' }}  # T343: agent_analyst (starts from the ml forecast); off until its evaluation passes (T345)
      ARENA_AGENT_SKILLS: ${{ (inputs.dry_run && (inputs.experimental || inputs.only == 'agent_skills')) && '1' || vars.ARENA_AGENT_SKILLS || '1' }}  # T353/T356: agent_skills (agent_quant plus load_skill); live as an experiment by owner decision 2026-11-28 although its pre-registered rule was not met; set the repository variable to 0 to switch it off
      ARENA_AGENT_GRAPH_SKILLS: ${{ (inputs.dry_run && (inputs.experimental || inputs.only == 'agent_graph_skills')) && '1' || vars.ARENA_AGENT_GRAPH_SKILLS || '0' }}  # T357: agent_graph_skills (agent_graph plus the estimate, calculator and load_skill); off until agent_skills passes its evaluation
      ARENA_AGENT_HYBRID_SKILLS: ${{ (inputs.dry_run && (inputs.experimental || inputs.only == 'agent_hybrid_skills')) && '1' || vars.ARENA_AGENT_HYBRID_SKILLS || '0' }}  # T358: agent_hybrid_skills (agent_hybrid plus the estimate, calculator and load_skill); off until agent_skills passes its evaluation
      ARENA_AGENT_COMMITTEE: ${{ (inputs.dry_run && (inputs.experimental || inputs.only == 'agent_committee')) && '1' || vars.ARENA_AGENT_COMMITTEE || '0' }}  # T363: agent_committee (specialist agents over A2A); off until its evaluation passes (T367)
      ARENA_AGENT_RAG: ${{ vars.ARENA_AGENT_RAG || '1' }}  # T120: similar-past-questions tool (local embeddings, no API cost)
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'stable' }}
          persist-credentials: false  # the ledger push sets its own header; avoid a duplicate
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip  # keeps the llama-cpp-python wheel built from source (T122)
          cache-dependency-path: requirements/*.txt
      - name: Install pinned dependencies
        run: |
          make setup
          .venv/bin/pip install -r requirements/rag.txt -r requirements/graph.txt -r requirements/inference.txt
      - name: Install the A2A SDK (agent_committee only; the run does not depend on it otherwise)
        if: env.ARENA_AGENT_COMMITTEE == '1'
        run: .venv/bin/pip install -r requirements/a2a.txt
      - name: Install the local LLM runtime (llm_local; a failure only skips llm_local)
        continue-on-error: true
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF"  # portable build, so the cached wheel fits any runner
        run: .venv/bin/pip install -r requirements/local.txt
      - name: Restore cached model weights (Qwen2.5-1.5B-Instruct GGUF, pinned revision)
        uses: actions/cache@v6
        with:
          path: models_cache
          key: models-qwen2.5-1.5b-instruct-q4km-91cad51
      - name: Restore cached fine-tuned model (llm_local_ft; keyed by the pin file)
        uses: actions/cache@v6
        with:
          path: models_cache/ft
          key: models-ft-${{ hashFiles('lab/artefacts/llm_local_ft.json') }}
      - name: Restore cached source data
        uses: actions/cache@v6
        with:
          path: data_cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-
      - name: Mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Let git push the ledger branch with the built-in token
        env:
          TOKEN: ${{ github.token }}
        run: |
          header=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $header"
          git config --global user.name forecast-arena-bot
          git config --global user.email forecast-arena-bot@users.noreply.github.com
      - name: Record application execution identity
        if: steps.mode.outputs.dry_run == 'false'
        run: .venv/bin/arena health execution --job morning --push
      - name: morning job
        run: |
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then
            .venv/bin/arena --dry-run daily morning --push
          else
            .venv/bin/arena daily morning --push
          fi
      - name: Measure when SMARD publishes tomorrow's generation forecasts (T222b, measurement only)
        continue-on-error: true
        run: .venv/bin/arena data smard-forecasts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify the ledger
        if: steps.mode.outputs.dry_run == 'false'
        run: .venv/bin/arena ledger verify --git
      - name: Build the site from the ledger
        run: .venv/bin/arena site build --out site
      - name: Upload the site for Pages
        if: steps.mode.outputs.dry_run == 'false'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Health check (SPEC 12)
        id: health
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail  # keep the check's exit code through tee
          .venv/bin/arena health check --job morning --report health.json ${{ (github.event_name == 'workflow_dispatch' && inputs.fail_health) && '--force-fail' || '' }} ${{ steps.mode.outputs.dry_run == 'false' && '--record' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open, update or close the incident issue
        if: always() && steps.mode.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/arena health incident --report health.json --job-status "${{ job.status }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Official start (SPEC 2.9; records the health report, writes the start once)
        if: always() && steps.mode.outputs.dry_run == 'false'
        run: .venv/bin/arena official update --push
      - name: Fail the run when a health check failed
        if: always() && steps.health.outcome == 'failure'
        run: exit 1

  deploy:
    needs: run
    if: always() && needs.run.outputs.dry_run == 'false'  # deploy even when a health check failed
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'stable' }}
          sparse-checkout: scripts/smoke_site.py
          persist-credentials: false
      - name: Smoke-test the published site (T182)
        run: python3 scripts/smoke_site.py "${{ steps.deployment.outputs.page_url }}"
