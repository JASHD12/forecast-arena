[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-arena"
version = "0.1.0"
description = "A live public benchmark of forecasters on tomorrow's real-world outcomes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "click>=8.1,<9",
    "jinja2>=3.1,<4",
    "numpy>=2,<3",
    "scikit-learn>=1.5,<2",
    "anthropic>=2.8,<3",
    "duckdb>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6", "pytest-cov>=5"]

[project.scripts]
arena = "arena.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arena = ["py.typed", "site/templates/*.html", "site/templates/*.xml", "site/static/*", "llm/prompts/*.md",
         "domains/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
